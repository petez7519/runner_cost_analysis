version: 2.1

jobs:
  runner-cost-analysis:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout

      - run:
          name: Install dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y jq git

      - run:
          name: Run combine_usagecsvs_2.sh
          command: |
            chmod +x combine_usagecsvs_2.sh
            ./combine_usagecsvs_2.sh

      - run:
          name: Run analyze_runner_costs.py
          command: |
            python analyze_runner_costs.py combined_runner_usage.csv > runner_cost_report.txt

      - store_artifacts:
          path: runner_cost_report.txt
          destination: runner_cost_report.txt

      - store_artifacts:
          path: combined_runner_usage.csv
          destination: combined_runner_usage.csv

workflows:
  runner-cost-analysis-workflow:
    jobs:
      - runner-cost-analysis

