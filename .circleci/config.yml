version: 2.1

parameters:
  org-id:
    type: string
    default: "your-org-id"
  start-date:
    type: string
    default: "2025-08-01"
  end-date:
    type: string
    default: "2025-08-31"
  api-token:
    type: string
    default: "your-circleci-api-token"

jobs:
  runner-cost-analysis:
    parameters:
      org-id: string
      start-date: string
      end-date: string
      api-token: string
    docker:
      - image: cimg/base:stable
    resource_class: medium
    steps:
      - checkout

      - setup_remote_docker:
          version: 20.10.24

      - run:
          name: Build custom analysis image
          command: docker build -t runner-cost-analyzer .

      - run:
          name: Run analysis container
          command: |
            mkdir -p output
            docker run --rm \
              -e ORG_ID="<< parameters.org-id >>" \
              -e START_DATE="<< parameters.start-date >>" \
              -e END_DATE="<< parameters.end-date >>" \
              -e CIRCLECI_API_TOKEN="<< parameters.api-token >>" \
              -v "$(pwd)/output:/app/output" \
              runner-cost-analyzer

      - store_artifacts:
          path: output/runner_cost_report.txt
          destination: runner_cost_report.txt

workflows:
  version: 2
  analyze-runner-costs:
    jobs:
      - runner-cost-analysis:
          org-id: "your-org-id"
          start-date: "2025-08-01"
          end-date: "2025-08-31"
          api-token: "your-circleci-api-token"
